name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restaurer les paquets
        run: dotnet restore StageTrackerAPI/StageTrackerAPI.slnx

      - name: Compiler
        run: dotnet build StageTrackerAPI/StageTrackerAPI.slnx --no-restore -c Release

      - name: Tests
        run: dotnet test StageTrackerAPI/StageTrackerAPI.slnx --no-build -c Release

  web:
    name: Interface (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stagetracker-web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stagetracker-web/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler
        run: npm run build

      - name: Tests
        run: npm test
